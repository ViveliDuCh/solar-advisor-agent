[project]
name = "solar-advisor-agent"
version = "0.2.0"
description = "Agent Framework solar optimization advisor for households"
requires-python = ">=3.11"
dependencies = [
  "agent-framework>=1.0",
  "agent-framework-foundry>=1.0",
  "azure-identity>=1.25",
  "fastapi>=0.110",
  "httpx>=0.27",
  "numpy>=2.1",
  "pandas>=2.2",
  "plotly>=6.0",
  "pvlib>=0.13",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "streamlit>=1.49",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]
devui = [
  "agent-framework-devui>=1.0",
]
aurora = [
  "cdsapi>=0.7",
  "microsoft-aurora>=1.8",
  "netcdf4>=1.7",
  "xarray>=2025.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
